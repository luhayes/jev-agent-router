[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-agent-router"
version = "0.1.0"
description = "Async confidence-gated Jev Choice routing with validated fallback and optional agent tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Framework :: AsyncIO"]

[project.scripts]
jev-benchmark = "jev_agent_router.benchmark.__main__:main"
jev-route = "integrations.cli:main"
jev-route-mcp = "integrations.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
langchain = ["langchain-core>=1.6,<2"]
crewai = ["crewai>=1.15,<2"]
pydantic-ai = ["pydantic-ai-slim>=2.46,<3"]
autogen = ["autogen-core>=0.7.5,<0.8"]
all = ["langchain-core>=1.6,<2", "crewai>=1.15,<2", "pydantic-ai-slim>=2.46,<3", "autogen-core>=0.7.5,<0.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1.2", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_agent_router", "integrations"]

[tool.hatch.build.targets.wheel.force-include]
"skills/jev-router" = "jev_agent_router/skills/jev-router"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
